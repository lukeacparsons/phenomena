services:
  web:
    image: vobarna-web:0bebdfc3e25e
    pull_policy: never
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    volumes:
      - /srv/vobarna/publication:/publication:ro
    expose:
      - '8787'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
